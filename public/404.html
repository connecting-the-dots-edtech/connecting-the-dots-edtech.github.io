<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <title>Connecting the Dots</title>
    <script type="text/javascript">
      // GitHub Pages has no server to rewrite deep links back to index.html,
      // so it serves this file for any path it doesn't recognize (e.g. a
      // hard refresh on /timeline). This is the standard workaround:
      // https://github.com/rafgraph/spa-github-pages
      //
      // pathSegmentsToKeep is 0 because this is an org root page
      // (connecting-the-dots-edtech.github.io), not a project page living
      // under a /repo-name/ subpath.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
