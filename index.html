    <meta property="og:title" content="Connecting the Dots — An Interactive Documentary of Islamic History" />

      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Connecting the Dots — An Interactive Documentary of Islamic History</title>
    <script>
      // Set the theme before first paint so there's no dark->light flash on
      // load. Kept intentionally tiny and dependency-free — this runs
      // before React (or anything else) exists.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {}
      })();
    </script>
    <script type="text/javascript">
      // Undoes the redirect public/404.html performs for deep links GitHub
      // Pages can't serve directly — restores the real path (e.g. /timeline)
      // via history.replaceState before React Router ever reads the URL.
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
